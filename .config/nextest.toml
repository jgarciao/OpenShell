[profile.ci]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Print slow test names after 30 seconds and terminate them after two minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

# Kubernetes e2e suite (e2e/rust/e2e-kubernetes.sh); separate from `ci` so its JUnit path and longer timeouts don't affect the workspace run.
[profile.e2e-kubernetes]
fail-fast = false
status-level = "slow"
final-status-level = "fail"
failure-output = "immediate-final"
# Flag slow tests after 60s and terminate them after five minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# Relative to the profile store dir (e2e/rust/target/nextest/e2e-kubernetes/);
# five `..` reach the repo-root results/. e2e-kubernetes.sh pins --target-dir to
# e2e/rust/target so this holds even when CARGO_TARGET_DIR is set. (nextest
# ignores absolute junit paths, so the path must be relative.)
[profile.e2e-kubernetes.junit]
path = "../../../../../results/e2e-kubernetes.xml"
